<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>0x0000 &#8212; Karl Keshavarzi</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root {
    --paper: #f4efe3;
    --ink: #1a1813;
    --ink-soft: #6b6252;
    --accent: #23407a;
    --serif: Georgia, "Times New Roman", Times, serif;
    --mono: ui-monospace, "Cascadia Mono", "SF Mono", "Segoe UI Mono", "Roboto Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 16px;
    padding: 24px;
    max-width: 620px;
    margin-inline: auto;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--serif);
    font-size: 16px;
    line-height: 1.625;
  }
  p { margin: 0; max-width: 60ch; }
  .code {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: .18em;
    color: var(--ink-soft);
  }
  .code b { color: var(--accent); font-weight: 500; letter-spacing: .06em; }
  h1 {
    font-family: var(--serif);
    font-size: 36px;
    font-weight: 400;
    letter-spacing: -.015em;
    margin: 0;
  }
  .home {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--ink-soft);
    text-decoration: none;
  }
  .home:hover { color: var(--ink); }
  .home .amp { color: var(--accent); }
</style>
</head>
<body>
  <p class="code"><b>0x0000</b> Null</p>
  <h1>Nothing mapped here.</h1>
  <p>That address doesn't resolve to a page.</p>
  <p><a class="home" href="/"><span class="amp">&amp;</span>index</a></p>
</body>
</html>
